# Diese Datei gehört in GitHub nach  .github/workflows/keepalive.yml
# GitHub schaltet Zeitpläne ab, wenn 60 Tage nichts am Repo passiert. Diese Datei macht einmal
# im Monat einen leeren Commit, damit der Zeitplan von „Sets bauen“ aktiv bleibt.
name: Aktiv halten

on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -q -m "keepalive"
          git push -q
